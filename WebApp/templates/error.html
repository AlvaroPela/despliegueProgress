{% extends 'base.html' %}
{% block title %}{{ titulo }}{% endblock %}
{% block header %}{% endblock %}
{% block content %}
<div class="card-soft error-page">
    <div class="icon"><i class="bi bi-exclamation-octagon"></i></div>
    <h1 class="h4 fw-800">{{ titulo }}</h1>
    <p class="text-muted mb-4">{{ mensaje }}</p>
    <div class="d-flex gap-2 justify-content-center">
        <button class="btn btn-ghost" onclick="history.back()"><i class="bi bi-arrow-left me-1"></i>Volver</button>
        <a class="btn btn-brand" href="{{ url_for('main.menu') }}"><i class="bi bi-house me-1"></i>Ir al inicio</a>
    </div>
</div>
{% endblock %}
